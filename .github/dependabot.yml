version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before taking a new release, so a broken or compromised one has time to be
    # caught and pulled. Security updates don't wait.
    cooldown:
      default-days: 7
    # Libraries that are released together go in one PR, since they often have to be updated together.
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
      androidx:
        patterns:
          - "androidx.*"
          - "com.android.*"
      ktor:
        patterns:
          - "io.ktor*"
      koin:
        patterns:
          - "io.insert-koin*"
      coil:
        patterns:
          - "io.coil-kt*"
      # Fixed versions required for the build tooling (the security-fixes bundle in the version catalog).
      security-fixes:
        patterns:
          - "org.bouncycastle*"
          - "org.bitbucket.b_c:jose4j"
          - "org.jdom:jdom2"
          - "org.apache.commons:commons-lang3"
          - "org.apache.httpcomponents:httpclient"
          - "org.freemarker:freemarker"
    ignore:
      # Espresso and JUnit 4 are built against Hamcrest 1.3 and bring in hamcrest-library 1.3. Hamcrest 3 replaces
      # their classes with incompatible ones, so tests through Espresso fail with NoSuchMethodError (#103). We only
      # declare hamcrest-core because buildHealth wants the transitive dependency declared. Move to Hamcrest 3 when
      # Espresso and JUnit do.
      - dependency-name: "org.hamcrest:hamcrest-core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

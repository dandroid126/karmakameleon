name: Claude Review

# An AI review of each PR, advisory only: it comments but isn't a required check, since a model's review isn't
# deterministic. It looks for what the static checks can't: logic bugs, poor abstractions and missed reuse.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# A new push cancels the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    # Fork and Dependabot PRs don't get the repo's secrets, and drafts aren't ready for review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # To post the review comments.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scripts the review can run to read this PR's review threads and pick the ones to resolve. Listing is the only
      # GraphQL call it can make: allowing `gh api graphql` itself would let it run any query.
      - name: Write the review thread scripts
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          dir="$RUNNER_TEMP/review-tools"
          mkdir -p "$dir" "$RUNNER_TEMP/threads-to-resolve"
          # Always there, so the resolve job finds the file even when nothing is to be resolved.
          touch "$RUNNER_TEMP/threads-to-resolve/ids.txt"
          header=$(printf '#!/usr/bin/env bash\nset -euo pipefail\nREPO=%q\nPR_NUMBER=%q\nQUEUE=%q\n' \
            "$REPO" "$PR_NUMBER" "$RUNNER_TEMP/threads-to-resolve/ids.txt")

          {
            echo "$header"
            cat <<'EOF'
          # Lists this PR's review threads as JSON, with every comment in each, so replies are visible too.
          gh api graphql --paginate -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id isResolved isOutdated path line
                      comments(first: 100) { nodes { author { login } body } }
                    }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest.reviewThreads.nodes[]
              | {id, isResolved, isOutdated, path, line, comments: [.comments.nodes[] | {author: .author.login, body}]}'
          EOF
          } > "$dir/list-threads.sh"

          {
            echo "$header"
            cat <<'EOF'
          # Marks one review thread to be resolved by its ID. The resolve job resolves it once the review is done, and
          # checks again that it's a thread the review opened on this PR.
          if [ $# -ne 1 ] || ! [[ "$1" =~ ^PRRT_[A-Za-z0-9_-]+$ ]]; then
            echo "Usage: resolve-thread.sh <thread ID, like PRRT_...>" >&2
            exit 2
          fi
          echo "$1" >> "$QUEUE"
          echo "Marked $1 to be resolved after the review."
          EOF
          } > "$dir/resolve-thread.sh"

          chmod +x "$dir"/*.sh

      - name: Review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          # A token for the owner's Claude subscription, from `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token instead of the Claude GitHub App, so it can only read the code and comment on the PR.
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The code in this repo is written by AI, and the PR checks already run ktlint,
            Detekt, Android Lint, a duplication check, architecture tests for the rules in CLAUDE.md, unit tests and
            coverage checks. Don't repeat what those catch, like formatting or style. Look for what they can't:

            - Logic bugs: wrong conditions, missed edge cases, race conditions, broken error handling, behavior
              that doesn't match what the PR says it does.
            - Poor abstractions and missed reuse: code that duplicates something the repo already has, or that is
              more complicated than it needs to be.
            - Tests that run code without really checking it, or that miss the behavior the PR changes.
            - Anything that goes against CLAUDE.md, including the parts no check covers.

            Earlier pushes to this PR may already have been reviewed. Before commenting, list the earlier review
            threads, with any replies, with `${{ runner.temp }}/review-tools/list-threads.sh`, and read the earlier
            summary with `gh pr view --comments`. Don't raise a finding again if it has already been raised, whether
            or not it was fixed or resolved.

            Then go through the unresolved threads you opened (their first comment is by github-actions). When the
            code now fixes the finding, mark the thread to be resolved with
            `${{ runner.temp }}/review-tools/resolve-thread.sh <thread id>`; it's resolved once your review is done.
            Leave it open when the fix is partial, or when someone replied to disagree or ask a question: a person
            decides those. Never mark a thread someone else opened.

            Read the surrounding code before commenting, so each comment is about a real problem. Use inline
            comments for specific lines, and say what's wrong and what to do instead. Skip praise and nitpicks.
            Then write one short summary with `gh pr comment --edit-last --create-if-none`, which replaces your
            earlier summary instead of adding another. Cover the whole PR as it is now, including which threads you
            marked to be resolved and which you left open and why. If nothing is left worth fixing, the summary says so
            in one line.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(${{ runner.temp }}/review-tools/list-threads.sh),Bash(${{ runner.temp }}/review-tools/resolve-thread.sh:*)"

      - name: Upload the threads to resolve
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threads-to-resolve
          path: ${{ runner.temp }}/threads-to-resolve/ids.txt
          if-no-files-found: error
          retention-days: 1

  # Resolves the threads the review marked, in a job of its own. Resolving needs a token that can write to the repo,
  # which the review job's AI step shouldn't hold, since it reads untrusted PR content. This job runs no AI: it only
  # resolves threads the review opened on this PR.
  resolve:
    name: Resolve Fixed Threads
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # GitHub only lets those who can write to the repo resolve review threads.
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: threads-to-resolve
          path: threads-to-resolve

      - name: Resolve the threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # In both queries, $id is a GraphQL variable, not a shell one, so it stays in single quotes.
          # shellcheck disable=SC2016
          thread_query='
            query($id: ID!) {
              node(id: $id) {
                ... on PullRequestReviewThread {
                  pullRequest { number repository { nameWithOwner } }
                  comments(first: 1) { nodes { author { login } } }
                }
              }
            }'
          # shellcheck disable=SC2016
          resolve_mutation='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }'
          resolved=0
          skipped=0
          while read -r id; do
            # The IDs were written by the review's AI step, so each one is checked before it's used.
            if ! [[ "$id" =~ ^PRRT_[A-Za-z0-9_-]+$ ]]; then
              echo "::warning::Skipped a line that isn't a review thread ID."
              skipped=$((skipped + 1))
              continue
            fi
            # A failed call skips this thread instead of ending the step, so the rest are still resolved.
            if ! thread=$(gh api graphql -f id="$id" -f query="$thread_query" --jq '.data.node'); then
              echo "::warning::Couldn't look up $id."
              skipped=$((skipped + 1))
              continue
            fi
            repo=$(jq -r '.pullRequest.repository.nameWithOwner // empty' <<< "$thread")
            number=$(jq -r '.pullRequest.number // empty' <<< "$thread")
            author=$(jq -r '.comments.nodes[0].author.login // empty' <<< "$thread")
            if [ "$repo" != "$REPO" ] || [ "$number" != "$PR_NUMBER" ] || [ "$author" != github-actions ]; then
              echo "::warning::Not resolving $id: it isn't a thread the review opened on this PR."
              skipped=$((skipped + 1))
              continue
            fi
            if ! gh api graphql -f id="$id" -f query="$resolve_mutation" >/dev/null; then
              echo "::warning::Couldn't resolve $id."
              skipped=$((skipped + 1))
              continue
            fi
            echo "Resolved $id."
            resolved=$((resolved + 1))
          done < <(sort -u threads-to-resolve/ids.txt)
          echo "Resolved $resolved review thread(s), skipped $skipped." >> "$GITHUB_STEP_SUMMARY"
          # Fails when any thread was skipped, so it shows up on the PR.
          [ "$skipped" -eq 0 ]

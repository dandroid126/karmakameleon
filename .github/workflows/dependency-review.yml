name: Dependency Review

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # GitHub can't read Gradle dependencies from the build files, so Gradle builds the dependency graph
  # and it's submitted for every PR and every push to main. Dependency review compares the two graphs,
  # and Dependabot alerts use the graph from main.
  generate-graph:
    name: Generate Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Generate dependency graph
        id: graph
        uses: gradle/actions/dependency-submission@v6
        env:
          # Only what goes into the APKs is "runtime"; build tooling and tests are "development".
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^(debug|release)RuntimeClasspath$'
        with:
          dependency-graph: generate-and-upload

      - name: Upload dependency graph
        uses: actions/upload-artifact@v7
        with:
          name: dependency-graph
          path: ${{ steps.graph.outputs.dependency-graph-file }}
          if-no-files-found: error

  submit-graph:
    # Submitting needs a token that can write to the repo, so only GitHub's own code runs in this job.
    # The build that generated the graph never sees the token.
    name: Submit Dependency Graph
    needs: generate-graph
    # PRs from forks don't get a token that can write to the repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download dependency graph
        uses: actions/download-artifact@v8
        with:
          name: dependency-graph
          path: graph

      - name: Submit dependency graph
        run: |
          find graph -name '*.json' -print0 | while IFS= read -r -d '' snapshot; do
            gh api --method POST "repos/$GH_REPO/dependency-graph/snapshots" --input "$snapshot"
          done

  dependency-review:
    name: Dependency Review
    needs: [ generate-graph, submit-graph ]
    # Runs even when an earlier job failed, since a skipped required check counts as passing.
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check the dependency graph was submitted
        env:
          GENERATE_RESULT: ${{ needs.generate-graph.result }}
          SUBMIT_RESULT: ${{ needs.submit-graph.result }}
        # Submitting is skipped for PRs from forks, so the review checks what it can without it.
        run: |
          if [ "$GENERATE_RESULT" != "success" ] || { [ "$SUBMIT_RESULT" != "success" ] && [ "$SUBMIT_RESULT" != "skipped" ]; }; then
            echo "::error::The dependency graph wasn't generated and submitted, so the dependencies can't be reviewed"
            exit 1
          fi

      # The build tooling runs in CI next to the signing key, so its vulnerabilities count too.
      - name: Review vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          # GitHub processes a submitted graph in the background, so wait for it to show up.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
          fail-on-scopes: runtime, development, unknown
          license-check: false

      # Only what ships in the app has to be compatible with its license, so build tooling and tests
      # can use any license.
      - name: Review licenses
        uses: actions/dependency-review-action@v5
        with:
          fail-on-scopes: runtime
          vulnerability-check: false
          # Licenses compatible with the app's GPL-3.0 license.
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, CC0-1.0, ISC, MIT, MPL-2.0,
            Unlicense, Zlib, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
            GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later

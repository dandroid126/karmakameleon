name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config, where later steps and actions could read it.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache; the default one is a proprietary Gradle component.
          cache-provider: basic
          # A release is built from scratch, so a poisoned cache entry can't end up in the published APK.
          cache-disabled: true

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          if-no-files-found: error

  publish:
    # Uses the built-in GITHUB_TOKEN, so there is no release token to keep up to date.
    # Only GitHub's own code runs in this job, since it is the one that can write to the repo.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: apk

      - name: Create Release
        run: |
          # On a re-run the release already exists, so replace its APK instead.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" apk/androidApp-release-unsigned.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" apk/androidApp-release-unsigned.apk \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "" \
              --prerelease
          fi

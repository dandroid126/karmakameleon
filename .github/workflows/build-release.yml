name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config, where later steps and actions could read it.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache; the default one is a proprietary Gradle component.
          cache-provider: basic
          # A release is built from scratch, so a poisoned cache entry can't end up in the published APK.
          cache-disabled: true

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          if-no-files-found: error

  publish:
    # Uses the built-in GITHUB_TOKEN, so there is no release token to keep up to date.
    # Only GitHub's own code runs in this job, since it is the one that can write to the repo and sign.
    needs: build
    runs-on: ubuntu-latest
    # The release key's secrets live in this environment, which only v* tags can use (docs/releasing.md).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # Catches a tag pushed on the wrong commit, such as a branch that wasn't merged. It doesn't stop a deliberate
      # attack, since whoever pushes a tag also chooses the workflow that runs: the tag ruleset does (docs/releasing.md).
      - name: Check that the tagged commit is on main
        run: |
          STATUS="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
          if [ "$STATUS" != identical ] && [ "$STATUS" != behind ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main (compared: $STATUS)"
            exit 1
          fi

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: apk

      # Signed here, rather than in the build job, so third-party actions and Gradle plugins never see the key.
      - name: Sign APK with the release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD must be set in the release environment"
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          # apksigner needs an aligned APK. -P 16 keeps native libraries aligned to 16 KB pages.
          "$BUILD_TOOLS/zipalign" -f -P 16 4 apk/androidApp-release-unsigned.apk apk/androidApp-release.apk
          KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias release apk/androidApp-release.apk
          rm "$KEYSTORE"
          "$BUILD_TOOLS/apksigner" verify --print-certs apk/androidApp-release.apk

      - name: Create Release
        run: |
          # On a re-run the release already exists, so replace its APK instead.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" apk/androidApp-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" apk/androidApp-release.apk \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "" \
              --prerelease
          fi

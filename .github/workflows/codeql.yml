name: CodeQL

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Weekly, so new queries in CodeQL releases also run on code that hasn't changed.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the results to the repo's code scanning alerts.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin has to be compiled for CodeQL to read it.
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config, where later steps and actions could read it.
          persist-credentials: false

      - name: Set up JDK 25
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache; the default one is a proprietary Gradle component.
          cache-provider: basic

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # CodeQL reads the code by watching the compiler run, so nothing can come from a cache
      # or a daemon started before it, and the Kotlin compiler has to run inside Gradle's process.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: >
          ./gradlew :androidApp:assembleDebug
          --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

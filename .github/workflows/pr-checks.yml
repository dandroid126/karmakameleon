name: PR Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config, where later steps and actions could read it.
          persist-credentials: false
          # The coverage check compares the PR with main, so it needs main's history.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache; the default one is a proprietary Gradle component.
          cache-provider: basic

      - name: Run unit tests and check coverage
        # verifyRoborazziDebug runs the app's tests and fails when a screenshot differs from the recorded one.
        run: ./gradlew :shared:testAndroidHostTest diffCoverage :shared:koverVerify :androidApp:verifyRoborazziDebug :androidApp:koverVerifyDebug

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: androidApp/build/outputs/roborazzi/
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Run static checks
        env:
          # zizmor uses it to check that each pinned action commit belongs to the action's repo and has no known
          # vulnerability. The job's token can only read the repo.
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew qualityGate

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gate-reports
          path: '**/build/reports/'

  # Warns when a PR changes more than MAX_LINES lines. Smaller PRs make each checker's findings easier to act on and
  # keep a reviewer, human or AI, accurate. It never fails, so split the work when it warns, but it doesn't block.
  pr-size:
    name: PR Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The checkout is the PR merged into main. Its first parent is the main commit it was merged into.
          fetch-depth: 2

      - name: Count changed lines
        env:
          MAX_LINES: 500
        run: |
          # Renamed and moved files count only their changed lines. The baselines don't count, since fixing findings
          # shrinks them; binary files show "-" and count as 0.
          lines=$(git diff --numstat -M HEAD^1 HEAD -- . ':(exclude)**/detekt-baseline*.xml' \
            ':(exclude)config/cpd/cpd-baseline.txt' | awk '{ total += ($1 == "-" ? 0 : $1 + $2) } END { print total + 0 }')
          echo "This PR changes $lines lines." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "::warning::This PR changes $lines lines, more than $MAX_LINES. Consider splitting it into smaller PRs."
          fi

  build-debug:
    name: Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-pr
          path: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          if-no-files-found: error
          # Long enough to re-run the size check after adding the apk-size-ok label.
          retention-days: 7

  # Builds main's release APK for the size check, in parallel with the PR's.
  build-release-main:
    name: Release Build (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The checkout is the PR merged into main. Its first parent is the main commit it was merged into.
          fetch-depth: 2

      - name: Check out main
        run: git checkout --detach HEAD^1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-main
          path: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  # Fails when the PR grows the release APK by more than MAX_GROWTH_PERCENT, which catches a large library added by
  # accident or R8 rules that stop shrinking. When the growth is intended, add the apk-size-ok label to the PR and
  # re-run this job: it reads the labels when it runs, so the builds don't have to run again.
  apk-size:
    name: APK Size
    needs: [build-release, build-release-main]
    # Runs even when a build failed, so this job fails on the missing APK. Skipped, it would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # To read the PR's labels.
      pull-requests: read
    steps:
      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-apk-*

      - name: Compare sizes
        env:
          MAX_GROWTH_PERCENT: 5
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          main_size=$(stat -c %s release-apk-main/androidApp-release-unsigned.apk)
          pr_size=$(stat -c %s release-apk-pr/androidApp-release-unsigned.apk)
          growth=$(awk -v main="$main_size" -v pr="$pr_size" 'BEGIN { printf "%.2f", (pr - main) * 100 / main }')
          {
            echo "| | Release APK |"
            echo "|---|---|"
            echo "| main | $main_size bytes |"
            echo "| This PR | $pr_size bytes |"
            echo "| Change | $((pr_size - main_size)) bytes ($growth%) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "main: $main_size bytes, this PR: $pr_size bytes, change: $growth%"
          if awk -v growth="$growth" -v max="$MAX_GROWTH_PERCENT" 'BEGIN { exit !(growth > max) }'; then
            labels=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
            if grep -qx apk-size-ok <<< "$labels"; then
              echo "The APK grew by more than $MAX_GROWTH_PERCENT%, but the PR has the apk-size-ok label."
            else
              echo "::error::The release APK grew by $growth%, more than $MAX_GROWTH_PERCENT%. Look for a large library" \
                "or a keep rule that stops R8 from shrinking. If the growth is intended, add the apk-size-ok label" \
                "to the PR and re-run this job."
              exit 1
            fi
          fi

name: Debug APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit_info.outputs.sha }}
      date: ${{ steps.commit_info.outputs.date }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Get commit info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

  publish:
    # Uses the built-in GITHUB_TOKEN, so there is no release token to keep up to date.
    # Only GitHub's own code runs in this job, since it is the one that can write to the repo.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: debug-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: apk

      - name: Create Debug Release
        env:
          SHA: ${{ needs.build.outputs.sha }}
          DATE: ${{ needs.build.outputs.date }}
        run: |
          cat > notes.md <<EOF
          Debug APK build from main branch

          **Commit**: $SHA
          **Date**: $DATE

          This is an unsigned debug build for testing purposes.
          EOF
          # Recreate the release so the debug-latest tag moves to this commit.
          if gh release view debug-latest > /dev/null 2>&1; then
            gh release delete debug-latest --cleanup-tag --yes
          fi
          gh release create debug-latest apk/androidApp-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Debug Build - $DATE" \
            --notes-file notes.md \
            --prerelease

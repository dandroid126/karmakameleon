name: Debug APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit_info.outputs.sha }}
      date: ${{ steps.commit_info.outputs.date }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config, where later steps and actions could read it.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache; the default one is a proprietary Gradle component.
          cache-provider: basic

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest

      # The profileable APK is release code with the debug package, for measuring performance. PRs build release
      # already, which runs the same R8 step, so only main builds this one.
      - name: Build APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleProfileable

      - name: Get commit info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          # Saved under their common folder, so they download as apk/debug/… and apk/profileable/….
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug.apk
            androidApp/build/outputs/apk/profileable/androidApp-profileable.apk
          if-no-files-found: error

  publish:
    # Uses the built-in GITHUB_TOKEN, so there is no release token to keep up to date.
    # Only GitHub's own code runs in this job, since it is the one that can write to the repo.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: debug-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-apk
          path: apk

      # Each runner signs debug builds with a new random key, which Android rejects as an
      # update. Re-sign with a fixed key here, rather than in the build job, so third-party
      # actions and Gradle plugins never see it.
      - name: Sign APKs with the debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ] || [ -z "$DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 and DEBUG_KEYSTORE_PASSWORD secrets must be set"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/debug.p12"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          for APK in apk/debug/androidApp-debug.apk apk/profileable/androidApp-profileable.apk; do
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass env:DEBUG_KEYSTORE_PASSWORD --ks-key-alias debug "$APK"
          done
          rm "$KEYSTORE"
          for APK in apk/debug/androidApp-debug.apk apk/profileable/androidApp-profileable.apk; do
            "$APKSIGNER" verify --print-certs "$APK"
          done

      - name: Create Debug Release
        env:
          SHA: ${{ needs.build.outputs.sha }}
          DATE: ${{ needs.build.outputs.date }}
        run: |
          cat > notes.md <<EOF
          Debug and profileable APK builds from main branch

          **Commit**: $SHA
          **Date**: $DATE

          These are builds for testing, signed with the project's debug key so they install as updates.

          - \`androidApp-debug.apk\`: debuggable.
          - \`androidApp-profileable.apk\`: release code that can be traced with Perfetto, for measuring performance.

          Both are the same app (\`com.karmakameleon.android.debug\`), so either one installs over the other and keeps the app's data.
          EOF
          # Recreate the release so the debug-latest tag moves to this commit.
          if gh release view debug-latest > /dev/null 2>&1; then
            gh release delete debug-latest --cleanup-tag --yes
          fi
          gh release create debug-latest apk/debug/androidApp-debug.apk apk/profileable/androidApp-profileable.apk \
            --target "$GITHUB_SHA" \
            --title "Debug Build - $DATE" \
            --notes-file notes.md \
            --prerelease

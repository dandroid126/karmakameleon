# The real KarmaKameleonApplication starts Koin and, once the app is in the foreground, polls Reddit's inbox. Tests
# get a plain Application instead, so they never touch the network and can set up their own dependencies.
application=android.app.Application
# A common phone size. Robolectric's default is 320dp wide, narrower than nearly every phone in use.
qualifiers=w360dp-h800dp
# SDK 36, not the app's 37: on SDK 37, Robolectric 4.17 sometimes copies a stale frame for screenshots, so after about
# 50 tests in one JVM they start coming out blank (https://github.com/robolectric/robolectric/issues/11392). The fix
# is merged but not released yet; #82 tracks going back to 37.
sdk=36

# Changes to Detekt's default rules; everything not listed here uses the default.
# Findings in code that existed when Detekt was added are in each module's detekt-baseline.xml. New code is held to
# every rule, so fix a finding instead of adding it to the baseline.

style:
  MaxLineLength:
    # Same as ktlint (.editorconfig).
    maxLineLength: 140
  MagicNumber:
    # Compose UI is full of literal sizes and colors.
    ignoreAnnotated: ['Composable']
  ReturnCount:
    # Early returns for guard clauses (`?: return`, `if (...) return`) keep code flat; count only the other returns.
    excludeGuardClauses: true

naming:
  FunctionNaming:
    # Compose functions are named like classes, and test names use underscores.
    ignoreAnnotated: ['Composable', 'Test']

complexity:
  LongParameterList:
    # Composables take many optional parameters by design.
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  TooManyFunctions:
    # Splitting a long function into private helpers is what LongMethod asks for, so don't count them against the class.
    ignorePrivate: true
    # Detekt's default list plus KMP's host test source set (androidHostTest), which it doesn't know about.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/androidHostTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
